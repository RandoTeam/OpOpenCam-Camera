plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Release signing: one project keystore shared by CI and local builds, so a
// CI-published beta can be updated in place by a local build and vice versa.
// The keystore and its passwords never enter the repository: locally they live
// in android_app/keystore.properties (gitignored), on CI in GitHub Secrets.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseStore = System.getenv("OPOPENCAM_KEYSTORE") ?: keystoreProps["storeFile"]
def hasReleaseSigning = releaseStore != null && !releaseStore.toString().trim().isEmpty()

android {
    namespace 'com.opopencam.camera'
    compileSdk 36

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStore)
                storePassword System.getenv("OPOPENCAM_KEYSTORE_PASSWORD") ?: keystoreProps["storePassword"]
                keyAlias System.getenv("OPOPENCAM_KEY_ALIAS") ?: keystoreProps["keyAlias"]
                keyPassword System.getenv("OPOPENCAM_KEY_PASSWORD") ?: keystoreProps["keyPassword"]
            }
        }
    }

    defaultConfig {
        applicationId "com.oneplus.camera"
        minSdk 29
        targetSdk 36
        versionCode 11
        versionName "0.5.4-beta.1"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Falls back to the machine debug key only when no project keystore
            // is configured (plain local experiments). CI and the release
            // workflow always provide OPOPENCAM_KEYSTORE.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
