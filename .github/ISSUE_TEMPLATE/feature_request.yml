name: Feature request
description: Propose a camera feature or quality improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or bad today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, API or pipeline change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it works? Include device tests and metrics.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Camera2 / capture
        - HDR / image quality
        - Live Photo / Motion Photo
        - Video / audio
        - Lenses / zoom
        - UI / UX
        - Build / CI
    validations:
      required: true
