name: Rust Camera CI

on:
  push:
    branches: [main]
    paths:
      - "rust_camera/**"
      - ".github/workflows/rust-camera-ci.yml"
  pull_request:
    paths:
      - "rust_camera/**"
      - ".github/workflows/rust-camera-ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "ndk;28.2.13676358"

      - name: Set NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Rust format
        working-directory: rust_camera/rust_core
        run: cargo fmt --check

      - name: Host unit tests
        working-directory: rust_camera/rust_core
        run: cargo test

      - name: Clippy (Android target)
        working-directory: rust_camera/rust_core
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
          CARGO_TARGET_AARCH64_LINUX_ANDROID_AR: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: cargo clippy --target aarch64-linux-android -- -D warnings

      - name: Build Rust engine
        working-directory: rust_camera/rust_core
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
          CARGO_TARGET_AARCH64_LINUX_ANDROID_AR: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: cargo build --release --target aarch64-linux-android

      - name: Copy native library
        run: |
          mkdir -p rust_camera/android_app/app/src/main/jniLibs/arm64-v8a
          cp rust_camera/rust_core/target/aarch64-linux-android/release/libopopencam.so \
             rust_camera/android_app/app/src/main/jniLibs/arm64-v8a/libopopencam.so

      - name: Version consistency
        run: python3 rust_camera/scripts/check_version.py

      - name: Assemble debug APK
        working-directory: rust_camera/android_app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opopencam-debug-apk
          path: rust_camera/android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
