name: Rust Camera Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "ndk;28.2.13676358"

      - name: Set NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Check tag matches VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(cat rust_camera/VERSION)"
          test "$TAG" = "$VERSION" || { echo "Tag $TAG != VERSION $VERSION"; exit 1; }

      - name: Build Rust engine
        working-directory: rust_camera/rust_core
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
          CARGO_TARGET_AARCH64_LINUX_ANDROID_AR: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: cargo build --release --target aarch64-linux-android

      - name: Copy native library
        run: |
          mkdir -p rust_camera/android_app/app/src/main/jniLibs/arm64-v8a
          cp rust_camera/rust_core/target/aarch64-linux-android/release/libopopencam.so \
             rust_camera/android_app/app/src/main/jniLibs/arm64-v8a/libopopencam.so

      - name: Assemble release APK
        working-directory: rust_camera/android_app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Checksums
        run: |
          cd rust_camera/android_app/app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: "OpOpenCam ${{ github.ref_name }}"
          prerelease: true
          generate_release_notes: true
          body: |
            **Alpha/beta build — debug-signed.**

            This APK is for testing the Rust Camera2 engine. It is not a stable
            daily camera yet. Known limitations are listed in the changelog.

            Install:
            ```
            adb install -r -g app-release.apk
            ```
          files: |
            rust_camera/android_app/app/build/outputs/apk/release/app-release.apk
            rust_camera/android_app/app/build/outputs/apk/release/app-release.apk.sha256
